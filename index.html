<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 әріпті екі буынды 35 сөзді оқы</title><meta property="og:title" content="4 ӘРІПТІ ЕКІ БУЫНДЫ 35 СӨЗДІ ОҚЫ"><meta property="og:description" content="Тұйық-ашық, ашық-тұйық және ашық-ашық буындардан құралған 35 сөзді оқуға арналған ойын"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:linear-gradient(165deg,#48c4f8 0%,#b9eeff 48%,#b3ec87 75%,#5dc74b 100%);font-family:'Times New Roman',serif;color:#133966}main{max-width:1360px;margin:auto}.banner{background:#fffbe5;border:6px solid #f4c94d;border-radius:35px;padding:14px;text-align:center;box-shadow:0 7px 0 #19445b22}h1{font-size:clamp(26px,3.8vw,51px);line-height:1.1;margin:0;font-weight:900}.subtitle{text-align:center;font-size:clamp(20px,2.5vw,30px);font-weight:900;margin:14px 0}.status{display:flex;align-items:center;justify-content:center;gap:20px;font-size:24px;font-weight:bold;margin-bottom:15px}.restart{font:bold 21px 'Times New Roman';background:white;border:2px solid #3b75a3;border-radius:13px;padding:8px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.tile{min-height:92px;font:bold clamp(31px,4.5vw,58px) 'Times New Roman';color:#050505;border:4px solid;border-radius:19px;box-shadow:0 6px 0 #0002;cursor:pointer;transition:opacity .22s,transform .22s}.tile:nth-child(5n+1){background:#ffe0ec;border-color:#f98db4}.tile:nth-child(5n+2){background:#fff2b7;border-color:#efc454}.tile:nth-child(5n+3){background:#def8d1;border-color:#9bd478}.tile:nth-child(5n+4){background:#d7f0ff;border-color:#76bdea}.tile:nth-child(5n){background:#ebdfff;border-color:#b894eb}.tile.gone{opacity:0;transform:scale(.7);pointer-events:none}.overlay{position:fixed;inset:0;background:#0d2946ad;display:flex;align-items:center;justify-content:center;padding:20px}.overlay.hidden{display:none}.panel{background:#fffbe5;border:7px solid #f4c94d;border-radius:30px;max-width:700px;padding:30px;text-align:center}.panel h2{font-size:clamp(35px,5vw,58px);margin:5px;color:#123e75}.panel p{font-size:clamp(22px,3vw,30px)}.start{font:bold 38px 'Times New Roman';background:#ec3d40;color:white;border:0;border-radius:18px;padding:14px 42px;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}.tile{min-height:75px;border-width:3px}.status{font-size:18px}.restart{font-size:17px}}@media(max-width:370px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><div class="banner"><h1>4 ӘРІПТІ ЕКІ БУЫНДЫ СӨЗДЕРДІ ОҚЫ!</h1></div><p class="subtitle">Сөзді оқы да, үстін бас — сөз жоғалады!</p><div class="status"><span id="count">Оқылғаны: 0 / 35</span><button class="restart" id="restart">ҚАЙТА БАСТАУ</button></div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay"><div class="panel"><h2 id="msg">СӨЗДЕРДІ ОҚЫ!</h2><p id="hint">35 сөзді оқып, әрқайсысын бас!</p><button class="start" id="start">БАСТА!</button></div></div><script>
const words=[{"word": "арба", "split": "ар-ба", "group": "Тұйық + ашық"}, {"word": "буын", "split": "бу-ын", "group": "Ашық + тұйық"}, {"word": "бала", "split": "ба-ла", "group": "Ашық + ашық"}, {"word": "арна", "split": "ар-на", "group": "Тұйық + ашық"}, {"word": "туыс", "split": "ту-ыс", "group": "Ашық + тұйық"}, {"word": "дала", "split": "да-ла", "group": "Ашық + ашық"}, {"word": "алма", "split": "ал-ма", "group": "Тұйық + ашық"}, {"word": "қуат", "split": "қу-ат", "group": "Ашық + тұйық"}, {"word": "қала", "split": "қа-ла", "group": "Ашық + ашық"}, {"word": "алқа", "split": "ал-қа", "group": "Тұйық + ашық"}, {"word": "суық", "split": "су-ық", "group": "Ашық + тұйық"}, {"word": "жаңа", "split": "жа-ңа", "group": "Ашық + ашық"}, {"word": "орда", "split": "ор-да", "group": "Тұйық + ашық"}, {"word": "жуас", "split": "жу-ас", "group": "Ашық + тұйық"}, {"word": "кеме", "split": "ке-ме", "group": "Ашық + ашық"}, {"word": "ерке", "split": "ер-ке", "group": "Тұйық + ашық"}, {"word": "жуан", "split": "жу-ан", "group": "Ашық + тұйық"}, {"word": "көже", "split": "кө-же", "group": "Ашық + ашық"}, {"word": "өрме", "split": "өр-ме", "group": "Тұйық + ашық"}, {"word": "суат", "split": "су-ат", "group": "Ашық + тұйық"}, {"word": "шана", "split": "ша-на", "group": "Ашық + ашық"}, {"word": "ескі", "split": "ес-кі", "group": "Тұйық + ашық"}, {"word": "қуыс", "split": "қу-ыс", "group": "Ашық + тұйық"}, {"word": "бота", "split": "бо-та", "group": "Ашық + ашық"}, {"word": "ұлпа", "split": "ұл-па", "group": "Тұйық + ашық"}, {"word": "буаз", "split": "бу-аз", "group": "Ашық + тұйық"}, {"word": "маса", "split": "ма-са", "group": "Ашық + ашық"}, {"word": "арқа", "split": "ар-қа", "group": "Тұйық + ашық"}, {"word": "шуақ", "split": "шу-ақ", "group": "Ашық + тұйық"}, {"word": "дана", "split": "да-на", "group": "Ашық + ашық"}, {"word": "арша", "split": "ар-ша", "group": "Тұйық + ашық"}, {"word": "шуыл", "split": "шу-ыл", "group": "Ашық + тұйық"}, {"word": "сана", "split": "са-на", "group": "Ашық + ашық"}, {"word": "алша", "split": "ал-ша", "group": "Тұйық + ашық"}, {"word": "дуал", "split": "ду-ал", "group": "Ашық + тұйық"}];let n=0;const grid=document.getElementById('grid'),count=document.getElementById('count'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),msg=document.getElementById('msg'),hint=document.getElementById('hint');function reset(){n=0;count.textContent='Оқылғаны: 0 / 35';grid.innerHTML='';for(const item of words){const b=document.createElement('button');b.className='tile';b.textContent=item.word;b.title=item.split+' ('+item.group+')';b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.classList.add('gone');count.textContent='Оқылғаны: '+(++n)+' / 35';if(n===35)setTimeout(()=>{msg.textContent='🌟 ЖАРАЙСЫҢ!';hint.textContent='35 сөздің бәрін оқыдың!';start.textContent='ҚАЙТА ОЙНАУ';start.onclick=()=>{reset();overlay.classList.add('hidden')};overlay.classList.remove('hidden')},300)};grid.appendChild(b)}}function welcome(){msg.textContent='СӨЗДЕРДІ ОҚЫ!';hint.textContent='35 сөзді оқып, әрқайсысын бас!';start.textContent='БАСТА!';start.onclick=()=>overlay.classList.add('hidden');overlay.classList.remove('hidden')}document.getElementById('restart').onclick=()=>{reset();welcome()};reset();welcome();
</script></body></html>
